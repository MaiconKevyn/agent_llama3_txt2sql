[project]
name = "datavis-sus-txt2sql"
version = "0.3.0"
description = "LangGraph-based Text-to-SQL agent for DataVisSUS healthcare analytics"
requires-python = ">=3.11"

dependencies = [
    # Core LLM and AI
    "langchain-core>=0.3.74",
    "langchain-community>=0.3.25",
    "langchain-openai>=0.3.32",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "openai>=1.55.0",
    # Observability and Experiment Tracking
    "mlflow>=2.15.0",
    # Web framework
    "fastapi>=0.115.13",
    "uvicorn>=0.34.3",
    "pydantic>=2.11.7",
    "requests>=2.32.4",
    "pyyaml>=6.0.2",
    # Database
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.41",
    # Environment
    "python-dotenv>=1.1.0",
    # Semantic table selection (Stage 2 embedding cascade)
    "sentence-transformers>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
