failure_categories:
  wrong_table_selection:
    description: "Agent did not select cid when the question requires the CID catalog."
  wrong_column_selection:
    description: "Agent used the wrong CID hierarchy column for the user intent."
  disease_resolution_error:
    description: "Agent mapped the clinical term to the wrong CID code, group, or chapter."
  under_aggregation:
    description: "Agent answered with a single CID when the question asks for a disease family."
  over_aggregation:
    description: "Agent used a broad chapter when the question asks for a specific disease."
  unsafe_join:
    description: "Agent used an audit-only CID join such as DIAG_SECUN or CID_MORTE."
  missing_join:
    description: "Agent should have joined internacoes to cid but queried only one side."
  wrong_metric_grain:
    description: "Agent aggregated at the wrong grain, duplicating or dropping admissions."
  lexical_normalization_gap:
    description: "Agent failed because of accents, plural, synonym, casing, abbreviation, or partial name."
  sql_runtime_error:
    description: "Generated SQL does not execute or cannot be explained by DuckDB."
  response_grounding_gap:
    description: "SQL is acceptable but the final natural-language answer misreads the result."
