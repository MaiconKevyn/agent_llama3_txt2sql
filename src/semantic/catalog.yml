version: 1
description: >
  Generic semantic layer for the SUS Text-to-SQL agent. Entries describe
  reusable metrics, dimensions, macros, and rules without referencing benchmark
  questions or expected answers.

metrics:
  total_internacoes:
    label: Total de internacoes
    grain: internacao
    metric_type: event_count
    expression_type: count
    expression: COUNT(*)
    denominator_scope: null
    default_scope: rows_matching_question_filters
    required_filters: []
    forbidden_filters: []
    null_policy: []
    aliases:
      - quantidade de internacoes
      - numero de internacoes
      - total de registros

  total_obitos:
    label: Total de obitos
    grain: internacao
    metric_type: event_count
    expression_type: count
    expression: SUM(CASE WHEN i."MORTE" = true THEN 1 ELSE 0 END)
    denominator_scope: null
    default_scope: rows_matching_non_outcome_filters
    required_filters: []
    forbidden_filters:
      - WHERE i."MORTE" = true when metric is used as numerator of a rate
    null_policy: []
    aliases:
      - mortes
      - obitos
      - registros com morte

  taxa_mortalidade:
    label: Taxa de mortalidade
    grain: internacao
    metric_type: derived_rate
    expression_type: rate
    numerator: SUM(CASE WHEN i."MORTE" = true THEN 1 ELSE 0 END)
    denominator: COUNT(*)
    denominator_scope: all_rows_matching_non_outcome_filters
    default_scope: same_group_and_non_outcome_filters
    required_filters: []
    forbidden_filters:
      - WHERE i."MORTE" = true
      - filtering denominator by outcome
    null_policy: []
    rules:
      - rate_denominator_must_preserve_full_scope
    aliases:
      - mortalidade
      - taxa de obito
      - percentual de obitos

  custo_medio_uti:
    label: Custo medio de UTI
    grain: internacao
    metric_type: event_average
    expression_type: avg
    expression: AVG(i."VAL_UTI")
    denominator_scope: rows_with_uti_cost
    default_scope: rows_matching_question_filters_with_uti_cost
    required_filters:
      - i."VAL_UTI" > 0
    forbidden_filters: []
    null_policy:
      - ignore_null_numeric_values_in_avg
    aliases:
      - valor medio de uti
      - media de custo de uti
      - custo medio da uti

  mortalidade_infantil_1ano:
    label: Taxa de mortalidade infantil ate 1 ano
    grain: municipio_ano
    metric_type: socioeconomic_indicator
    expression_type: avg
    expression: AVG(s."VL_MORT_INFANTIL")
    denominator_scope: rows_matching_question_filters
    default_scope: socioeconomico rows with VL_MORT_INFANTIL
    required_filters:
      - s."VL_MORT_INFANTIL" IS NOT NULL
    forbidden_filters:
      - s.metrica
      - s.valor
      - deriving infant mortality from internacoes.MORTE
    null_policy:
      - ignore_null_numeric_values_in_avg
    rules: []
    aliases:
      - mortalidade infantil
      - taxa de mortalidade infantil
      - mortalidade infantil media

  populacao_total:
    label: Populacao total municipal
    grain: municipio_ano
    metric_type: socioeconomic_indicator
    expression_type: sum
    expression: SUM(s."QT_POPULACAO")
    denominator_scope: rows_matching_question_filters
    default_scope: socioeconomico rows with QT_POPULACAO
    required_filters:
      - s."QT_POPULACAO" IS NOT NULL
    forbidden_filters:
      - s.metrica
      - s.valor
    null_policy: []
    rules: []
    aliases:
      - populacao
      - habitantes
      - populacao total

  pib_per_capita:
    label: PIB per capita municipal
    grain: municipio_ano
    metric_type: socioeconomic_indicator
    expression_type: avg
    expression: AVG(s."VL_PIB_PERCAPITA")
    denominator_scope: rows_matching_question_filters
    default_scope: socioeconomico rows with VL_PIB_PERCAPITA
    required_filters:
      - s."VL_PIB_PERCAPITA" IS NOT NULL
    forbidden_filters:
      - s.metrica
      - s.valor
    null_policy:
      - ignore_null_numeric_values_in_avg
    rules: []
    aliases:
      - pib per capita
      - produto interno bruto per capita

  leitos_sus_total:
    label: Total de leitos SUS
    grain: municipio_ano
    metric_type: socioeconomic_indicator
    expression_type: sum
    expression: SUM(s."QT_LEITOS_SUS")
    denominator_scope: rows_matching_question_filters
    default_scope: socioeconomico rows with QT_LEITOS_SUS
    required_filters:
      - s."QT_LEITOS_SUS" IS NOT NULL
    forbidden_filters:
      - s.metrica
      - s.valor
    null_policy: []
    rules: []
    aliases:
      - leitos sus
      - total de leitos sus

  medicos_total:
    label: Total de medicos
    grain: municipio_ano
    metric_type: socioeconomic_indicator
    expression_type: sum
    expression: SUM(s."QT_MEDICOS")
    denominator_scope: rows_matching_question_filters
    default_scope: socioeconomico rows with QT_MEDICOS
    required_filters:
      - s."QT_MEDICOS" IS NOT NULL
    forbidden_filters:
      - s.metrica
      - s.valor
    null_policy: []
    rules: []
    aliases:
      - medicos
      - médicos
      - total de medicos
      - total de médicos

  cid_catalog_count:
    label: Total de codigos CID-10 cadastrados
    grain: cid_code
    metric_type: catalog_cardinality
    expression_type: count
    expression: COUNT(DISTINCT c."CID")
    denominator_scope: null
    default_scope: cid reference table
    required_filters: []
    forbidden_filters:
      - counting internacoes.DIAG_PRINC when the question asks how many CID-10 codes exist
    null_policy: []
    rules:
      - catalog_cardinality_must_use_reference_table
    aliases:
      - codigos cid existentes
      - codigos cid cadastrados
      - cid-10 distintos existem
      - quantos cids existem

  vincprev_catalog_count:
    label: Total de tipos de vinculo previdenciario cadastrados
    grain: vincprev_code
    metric_type: catalog_cardinality
    expression_type: count
    expression: COUNT(*) FROM vincprev
    denominator_scope: null
    default_scope: vincprev reference table
    required_filters: []
    forbidden_filters:
      - counting internacoes.VINCPREV when the question asks how many vincprev types exist
    null_policy: []
    rules:
      - catalog_cardinality_must_use_reference_table
    aliases:
      - tipos de vinculo previdenciario
      - vinculos previdenciarios existentes
      - vinculos previdenciarios cadastrados

  municipio_catalog_count:
    label: Total de municipios cadastrados na dimensao geografica
    grain: municipio
    metric_type: catalog_cardinality
    expression_type: count
    expression: COUNT(*) FROM municipios
    denominator_scope: null
    default_scope: municipios reference table
    required_filters: []
    forbidden_filters:
      - joining internacoes when the question asks how many municipalities are covered or registered
    null_policy: []
    rules:
      - catalog_cardinality_must_use_reference_table
    aliases:
      - municipios cadastrados
      - municipios cobertos pelo banco
      - municipios por estado

  estado_coverage_count:
    label: Total de estados cobertos pela dimensao geografica
    grain: estado
    metric_type: catalog_cardinality
    expression_type: count_distinct
    expression: COUNT(DISTINCT m."SG_UF") FROM municipios m
    denominator_scope: null
    default_scope: municipios reference table
    required_filters: []
    forbidden_filters:
      - joining internacoes when the question asks how many states the database covers
    null_policy: []
    rules:
      - catalog_cardinality_must_use_reference_table
    aliases:
      - estados cobertos pelo banco de dados
      - estados distintos cadastrados
      - cobertura de estados

dimensions:
  estado_residencia:
    label: Estado de residencia do paciente
    source: municipios.SG_UF
    grain: internacao
    joins:
      - internacoes.MUNIC_RES -> municipios.CO_MUNICIPIO_6D
    join_path:
      - internacoes.MUNIC_RES -> municipios.CO_MUNICIPIO_6D
    default_for:
      - por estado
      - estado do paciente
      - residencia
    aliases:
      - uf de residencia
      - estado de residencia
      - estado do paciente
    null_policy:
      - preserve_unknown_residence_when_requested

  estado_hospital:
    label: Estado onde o hospital esta localizado
    source: municipios.SG_UF
    grain: internacao
    joins:
      - internacoes.CNES -> hospital.CNES
      - hospital.MUNIC_MOV -> municipios.CO_MUNICIPIO_6D
    join_path:
      - internacoes.CNES -> hospital.CNES
      - hospital.MUNIC_MOV -> municipios.CO_MUNICIPIO_6D
    default_for:
      - estado do hospital
      - hospitais por estado
      - localizacao do hospital por estado
    aliases:
      - uf do hospital
      - estado do estabelecimento
      - estado de atendimento
    null_policy:
      - preserve_unknown_hospital_location_when_requested

  estado_socioeconomico:
    label: Estado de indicador socioeconomico municipal
    source: municipios.SG_UF
    grain: municipio_ano
    joins:
      - socioeconomico.CO_MUNICIPIO_6D -> municipios.CO_MUNICIPIO_6D
    join_path:
      - socioeconomico.CO_MUNICIPIO_6D -> municipios.CO_MUNICIPIO_6D
    default_for:
      - indicador por estado
      - socioeconomico por estado
      - indicador municipal por estado
    aliases:
      - uf do indicador
      - estado do municipio
      - estado em socioeconomico
    null_policy: []

  municipio_residencia:
    label: Municipio de residencia do paciente
    source: municipios.NO_MUNICIPIO
    grain: internacao
    joins:
      - internacoes.MUNIC_RES -> municipios.CO_MUNICIPIO_6D
    join_path:
      - internacoes.MUNIC_RES -> municipios.CO_MUNICIPIO_6D
    default_for:
      - por municipio
      - municipio do paciente
      - residencia
    aliases:
      - cidade de residencia
      - municipio de residencia
      - municipio do paciente
    null_policy:
      - preserve_unknown_residence_when_requested

  municipio_socioeconomico:
    label: Municipio de indicador socioeconomico municipal
    source: municipios.NO_MUNICIPIO
    grain: municipio_ano
    joins:
      - socioeconomico.CO_MUNICIPIO_6D -> municipios.CO_MUNICIPIO_6D
    join_path:
      - socioeconomico.CO_MUNICIPIO_6D -> municipios.CO_MUNICIPIO_6D
    default_for:
      - indicador por municipio
      - socioeconomico por municipio
      - indicador municipal por municipio
      - municipio com maior populacao
    aliases:
      - cidade do indicador
      - municipio do indicador
      - municipio em socioeconomico
    null_policy: []

  municipio_hospital:
    label: Municipio onde o hospital esta localizado
    source: municipios.NO_MUNICIPIO
    grain: internacao
    joins:
      - internacoes.CNES -> hospital.CNES
      - hospital.MUNIC_MOV -> municipios.CO_MUNICIPIO_6D
    join_path:
      - internacoes.CNES -> hospital.CNES
      - hospital.MUNIC_MOV -> municipios.CO_MUNICIPIO_6D
    default_for:
      - municipio do hospital
      - municipios que atendem
      - localizacao do hospital
    aliases:
      - localizacao do hospital
      - cidade do hospital
      - municipio de atendimento
    null_policy:
      - preserve_unknown_hospital_location_when_requested

  hospital:
    label: Hospital/estabelecimento
    source: internacoes.CNES
    grain: internacao
    joins:
      - internacoes.CNES -> hospital.CNES
    join_path:
      - internacoes.CNES -> hospital.CNES
    aliases:
      - estabelecimento
      - cnes
      - hospital
    null_policy: []
    output_policy: preserve_cnes_identifier

  procedimento:
    label: Procedimento realizado
    source: procedimentos.NOME_PROC
    grain: procedimento_ocorrencia
    joins:
      - internacoes.N_AIH -> internacao_procedimento.N_AIH
      - internacao_procedimento.PROC_REA -> procedimentos.PROC_REA
    join_path:
      - internacoes.N_AIH -> internacao_procedimento.N_AIH
      - internacao_procedimento.PROC_REA -> procedimentos.PROC_REA
    aliases:
      - procedimento
      - procedimento realizado
      - procedimento sus
    null_policy: []

  contraceptivo:
    label: Metodo contraceptivo
    source: contraceptivos.DESCRICAO
    grain: internacao_obstetrica
    joins:
      - internacoes.CONTRACEP1 -> contraceptivos.CONTRACEPTIVO
    join_path:
      - internacoes.CONTRACEP1 -> contraceptivos.CONTRACEPTIVO
    aliases:
      - contraceptivo
      - contraceptivos
      - metodo contraceptivo
      - metodos contraceptivos
    null_policy:
      - preserve_unknown_bucket_when_requested

  sexo:
    label: Sexo do paciente
    source: internacoes.SEXO
    grain: internacao
    joins: []
    join_path: []
    aliases:
      - sexo
      - homens
      - mulheres
    null_policy:
      - preserve_unknown_bucket_when_requested

  ano_internacao:
    label: Ano da internacao
    source: EXTRACT(YEAR FROM internacoes.DT_INTER)
    grain: internacao
    joins: []
    join_path: []
    aliases:
      - ano
      - anual
      - ano da internacao
    null_policy: []

  instrucao:
    label: Nivel de instrucao/escolaridade do paciente
    source: instrucao.DESCRICAO
    grain: internacao
    joins:
      - internacoes.INSTRU -> instrucao.INSTRU
    join_path:
      - internacoes.INSTRU -> instrucao.INSTRU
    aliases:
      - nivel de instrucao
      - grau de instrucao
      - escolaridade
    null_policy:
      - exclude_code_zero_unless_unknown_bucket_requested
    output_policy: use_description_label

  raca_cor:
    label: Raca/cor do paciente
    source: raca_cor.DESCRICAO
    grain: internacao
    joins:
      - internacoes.RACA_COR -> raca_cor.RACA_COR
    join_path:
      - internacoes.RACA_COR -> raca_cor.RACA_COR
    aliases:
      - raca
      - cor
      - raca cor
    null_policy:
      - preserve_unknown_bucket_for_distribution
      - exclude_unknown_codes_for_rates_or_averages
    output_policy: use_description_label

macros:
  top_n_per_group:
    description: Ranking por grupo usando janela particionada.
    required_sql_features:
      - window_function
      - partition_by
      - rank_filter
    template: |
      SELECT *
      FROM (
          SELECT
              {group_columns},
              {entity_column},
              {metric_expression} AS metric_value,
              ROW_NUMBER() OVER (
                  PARTITION BY {group_columns}
                  ORDER BY {metric_expression} DESC
              ) AS semantic_rank
          FROM {from_clause}
          {where_clause}
          GROUP BY {group_columns}, {entity_column}
      ) ranked
      WHERE semantic_rank <= {top_n}

  mortality_rate:
    description: Taxa de mortalidade preservando denominador completo.
    required_sql_features:
      - conditional_aggregation
      - full_denominator_scope
    template: |
      SUM(CASE WHEN i."MORTE" = true THEN 1 ELSE 0 END) * 100.0 / COUNT(*)

  absence_by_entity:
    description: Entidades sem ocorrencia de uma condicao.
    required_sql_features:
      - not_exists_or_aggregate_zero
    template: |
      GROUP BY {entity_column}
      HAVING COUNT(*) > {minimum_count}
         AND SUM(CASE WHEN {absence_condition} THEN 1 ELSE 0 END) = 0

rules:
  rate_denominator_must_preserve_full_scope:
    severity: error
    description: >
      Taxas devem manter o denominador com todas as linhas do escopo. O desfecho
      deve aparecer em agregacao condicional, nao no WHERE.

  top_n_per_group_requires_window_partition:
    severity: error
    description: >
      Top-N por grupo deve usar ROW_NUMBER, RANK ou DENSE_RANK com PARTITION BY
      na dimensao do grupo.

  absence_condition_requires_antijoin_or_aggregate_zero:
    severity: error
    description: >
      Perguntas com nunca, sem registro ou nenhuma ocorrencia devem usar anti-join
      ou agregacao com soma zero.

  include_unknown_bucket_with_left_join_or_coalesce:
    severity: error
    description: >
      Perguntas que pedem sem informacao devem preservar linhas sem correspondencia
      ou codigos desconhecidos em bucket explicito.

  join_path_hospital_location_required:
    severity: error
    description: >
      Perguntas sobre municipio/estado de atendimento, hospital ou localizacao do
      hospital devem usar internacoes.CNES -> hospital.CNES -> hospital.MUNIC_MOV
      -> municipios.CO_MUNICIPIO_6D, nao MUNIC_RES.

  domain_instrucao_valid_required:
    severity: error
    description: >
      Analises por nivel de instrucao devem juntar a tabela instrucao e excluir
      INSTRU nulo ou 0, exceto quando a pergunta solicitar explicitamente sem
      informacao.

  socioeconomico_metric_filter_required:
    severity: error
    description: >
      Regra legada para schema long-format. No schema atual, socioeconomico usa
      colunas explicitas como VL_MORT_INFANTIL e QT_POPULACAO.

  socioeconomico_column_metric_required:
    severity: error
    description: >
      Indicadores socioeconomicos devem usar as colunas explicitas do schema atual,
      como QT_POPULACAO e VL_MORT_INFANTIL, sem filtros metrica/valor.

  socioeconomico_multi_column_metrics_required:
    severity: error
    description: >
      Perguntas com multiplos indicadores socioeconomicos devem selecionar ou agregar
      cada coluna explicita necessaria do schema wide-format.

  top_n_average_high_cardinality_requires_minimum_group_size:
    severity: error
    description: >
      Rankings top-N por media ou taxa em entidades de alta cardinalidade devem
      aplicar suporte minimo de grupo, por exemplo HAVING COUNT(*) > 100, para
      evitar ordenar entidades com amostras pequenas.

  catalog_cardinality_must_use_reference_table:
    severity: error
    description: >
      Perguntas sobre quantos codigos/tipos existem, estao cadastrados ou estao
      disponiveis em um catalogo devem contar a tabela de referencia. So use a
      tabela fato quando a pergunta pedir valores observados, registrados ou
      usados em internacoes.
