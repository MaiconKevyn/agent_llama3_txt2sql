<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Balanced Animated DataVisSUS Text-to-SQL Agent Flow</title>
  <desc id="desc">README-friendly animated diagram showing frontend, API, LangGraph workflow, semantic layer, execution services, and repair loop.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,6 0,12" fill="#0D32B2"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,6 0,12" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,6 0,12" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style><![CDATA[
      .bg { fill: #ffffff; }
      .surface { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .backend { fill: #f1f5fb; stroke: #3b82f6; stroke-width: 2; }
      .orch-box { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; }
      .card { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
      .step { fill: #ffffff; stroke: #be185d; stroke-width: 1.4; }
      .semantic { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; }
      .service { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; }
      .runtime-badge { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.2; }
      .database { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
      .phase-blue { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
      .phase-green { fill: #ecfdf5; stroke: #bbf7d0; stroke-width: 1; }
      .phase-orange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1; }
      .label-pill { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1; opacity: .96; }
      .title { fill: #1e3a8a; font: 500 28px Inter, Arial, sans-serif; text-anchor: middle; }
      .surface-title { fill: #3b0764; font: 500 24px Inter, Arial, sans-serif; text-anchor: middle; }
      .orch-title { fill: #500724; font: 600 24px Inter, Arial, sans-serif; text-anchor: middle; }
      .label { fill: #111827; font: 700 16px Inter, Arial, sans-serif; text-anchor: middle; }
      .label-small { fill: #111827; font: 700 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .caption { fill: #475569; font: 700 12px Inter, Arial, sans-serif; text-anchor: middle; }
      .green-label { fill: #16a34a; font: 700 14px Inter, Arial, sans-serif; text-anchor: middle; }
      .runtime-label { fill: #1e3a8a; font: 700 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .badge-label { fill: #166534; font: 800 10px Inter, Arial, sans-serif; text-anchor: middle; }
      .blue-label { fill: #0D32B2; font: 700 14px Inter, Arial, sans-serif; text-anchor: middle; }
      .orange-label { fill: #ea580c; font: 700 14px Inter, Arial, sans-serif; text-anchor: middle; }
      .phase-label { fill: #334155; font: 700 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .muted-label { fill: #64748b; font: italic 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .person { fill: #E3E9FD; stroke: #0D32B2; stroke-width: 2.4; }
      .flow-blue {
        fill: none;
        stroke: #0D32B2;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 12 10;
        marker-end: url(#arrow-blue);
        animation: flowDash 1.4s linear infinite;
      }
      .flow-green {
        fill: none;
        stroke: #16a34a;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 12 10;
        marker-end: url(#arrow-green);
        animation: flowDash 1.4s linear infinite;
      }
      .flow-orange {
        fill: none;
        stroke: #ea580c;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 12 10;
        marker-end: url(#arrow-orange);
        animation: flowDash 1.4s linear infinite;
      }
      .plain-line {
        fill: none;
        stroke: #cbd5e1;
        stroke-width: 1.3;
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 44; }
        to { stroke-dashoffset: 0; }
      }
    ]]></style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <g id="phase-guide">
    <rect class="phase-blue" x="98" y="48" width="250" height="36" rx="18"/>
    <text class="phase-label" x="223" y="71">1. Intent Understanding</text>
    <rect class="phase-green" x="635" y="48" width="282" height="36" rx="18"/>
    <text class="phase-label" x="776" y="71">2. Semantic SQL Generation</text>
    <rect class="phase-orange" x="1132" y="48" width="270" height="36" rx="18"/>
    <text class="phase-label" x="1267" y="71">3. Validation and Feedback</text>
  </g>

  <g id="surface">
    <path class="person" d="M 86 255 H 38 V 254 C 38 243 43 233 52 228 C 47 224 44 217 44 210 C 44 198 52 188 62 188 C 72 188 80 198 80 210 C 80 217 77 223 73 227 C 82 232 87 242 87 253 V 254 H 86 Z"/>
    <text class="label" x="62" y="283">User</text>

    <rect class="surface" x="150" y="128" width="240" height="228" rx="16" filter="url(#shadow)"/>
    <text class="surface-title" x="270" y="166">Web frontend</text>
    <rect class="card" x="190" y="200" width="160" height="72" rx="10"/>
    <text class="label" x="270" y="233"><tspan x="270" dy="0">Chat UI</tspan><tspan x="270" dy="18">(Express + JS)</tspan></text>
    <text class="caption" x="270" y="318"><tspan x="270" dy="0">Ask questions and inspect</tspan><tspan x="270" dy="15">SQL, answers, and charts</tspan></text>
  </g>

  <g id="backend">
    <rect class="backend" x="470" y="118" width="990" height="690" rx="18" filter="url(#shadow)"/>
    <text class="title" x="915" y="158">Agent Backend</text>
    <rect class="runtime-badge" x="1130" y="136" width="288" height="34" rx="17"/>
    <text class="runtime-label" x="1274" y="158">Model runtime: OpenAI gpt-4o-mini</text>

    <rect class="card" x="568" y="206" width="164" height="76" rx="10"/>
    <text class="label" x="650" y="250">FastAPI gateway</text>

    <rect class="orch-box" x="500" y="355" width="900" height="305" rx="16"/>
    <text class="orch-title" x="950" y="392">LangGraph Orchestrator</text>

    <rect class="step" x="590" y="430" width="120" height="72" rx="10"/>
    <text class="label-small" x="650" y="470">1. Classify</text>
    <rect class="step" x="800" y="430" width="128" height="72" rx="10"/>
    <text class="label-small" x="864" y="452"><tspan x="864" dy="0">2. Discover</tspan><tspan x="864" dy="15">&amp; select</tspan><tspan x="864" dy="15">tables</tspan></text>
    <rect class="step" x="1010" y="430" width="120" height="72" rx="10"/>
    <text class="label-small" x="1070" y="470">3. Schema</text>
    <rect class="step" x="1220" y="430" width="130" height="72" rx="10"/>
    <text class="label-small" x="1285" y="459"><tspan x="1285" dy="0">4. Semantic</tspan><tspan x="1285" dy="16">plan</tspan></text>

    <rect class="step" x="1220" y="548" width="130" height="72" rx="10"/>
    <text class="label-small" x="1285" y="577"><tspan x="1285" dy="0">5. Generate</tspan><tspan x="1285" dy="16">SQL</tspan></text>
    <rect class="step" x="1010" y="548" width="120" height="72" rx="10"/>
    <text class="label-small" x="1070" y="588">6. Validate</text>
    <rect class="step" x="800" y="548" width="128" height="72" rx="10"/>
    <text class="label-small" x="864" y="588">7. Execute</text>
    <rect class="step" x="590" y="548" width="120" height="72" rx="10"/>
    <text class="label-small" x="650" y="577"><tspan x="650" dy="0">8. Compose</tspan><tspan x="650" dy="16">answer</tspan></text>
  </g>

  <g id="semantic-layer">
    <rect class="semantic" x="940" y="205" width="286" height="102" rx="14" filter="url(#shadow)"/>
    <text class="label" x="1083" y="238">Semantic Layer</text>
    <text class="caption" x="1083" y="264"><tspan x="1083" dy="0">metrics · domain rules · join paths</tspan><tspan x="1083" dy="16">data profile · validation guidance</tspan></text>
  </g>

  <g id="services">
    <rect class="service" x="1252" y="680" width="164" height="82" rx="10"/>
    <text class="label" x="1334" y="712"><tspan x="1334" dy="0">MLflow + logs</tspan><tspan x="1334" dy="18">observability</tspan></text>
  </g>

  <g id="database">
    <path class="database" d="M 204 640 C 204 624 336 624 336 640 V 718 C 336 734 204 734 204 718 Z"/>
    <ellipse class="database" cx="270" cy="640" rx="66" ry="16"/>
    <path class="plain-line" d="M 204 679 C 204 695 336 695 336 679"/>
    <text class="label" x="270" y="684">DuckDB</text>
  </g>

  <g id="connections">
    <path class="flow-blue" d="M90 236 H184"/>
    <rect class="label-pill" x="107" y="202" width="66" height="26" rx="13"/>
    <text class="blue-label" x="140" y="221">ask</text>

    <path class="flow-blue" d="M350 236 H564"/>
    <rect class="label-pill" x="410" y="202" width="70" height="26" rx="13"/>
    <text class="blue-label" x="445" y="221">HTTP</text>

    <path class="flow-blue" d="M650 282 V426"/>
    <rect class="label-pill" x="662" y="322" width="112" height="26" rx="13"/>
    <text class="blue-label" x="718" y="341">user message</text>

    <path class="flow-blue" d="M710 466 H796"/>
    <rect class="label-pill" x="726" y="432" width="58" height="26" rx="13"/>
    <text class="blue-label" x="755" y="451">query</text>
    <path class="flow-blue" d="M650 502 V544"/>
    <rect class="label-pill" x="508" y="512" width="134" height="26" rx="13"/>
    <text class="blue-label" x="575" y="531">conversational</text>
    <path class="flow-blue" d="M928 466 H1006"/>
    <path class="flow-green" d="M1130 466 H1216"/>
    <path class="flow-green" d="M1285 502 V544"/>
    <path class="flow-blue" d="M1220 584 H1134"/>
    <path class="flow-blue" d="M1010 584 H932"/>
    <path class="flow-blue" d="M800 584 H714"/>

    <path class="flow-green" d="M1226 256 H1380 V466 H1354"/>
    <rect class="label-pill" x="1314" y="322" width="136" height="26" rx="13"/>
    <text class="green-label" x="1382" y="341">semantic context</text>

    <path class="flow-blue" d="M864 620 V760 H270 V725"/>
    <rect class="label-pill" x="494" y="726" width="96" height="26" rx="13"/>
    <text class="blue-label" x="542" y="745">execute</text>

    <path class="flow-blue" d="M590 584 H270 V356"/>
    <rect class="label-pill" x="328" y="550" width="118" height="26" rx="13"/>
    <text class="blue-label" x="387" y="569">final answer</text>

    <path class="flow-blue" d="M1305 620 V676"/>
    <rect class="label-pill" x="1320" y="640" width="74" height="26" rx="13"/>
    <text class="blue-label" x="1357" y="659">log run</text>

    <path class="flow-orange" d="M1070 620 V665 H1265 V624"/>
    <rect class="label-pill" x="1090" y="672" width="126" height="26" rx="13"/>
    <text class="orange-label" x="1153" y="691">repair loop</text>
  </g>

  <text class="muted-label" x="800" y="846">Animated dashed arrows indicate concurrent data, context, execution, and recovery flows.</text>
</svg>
