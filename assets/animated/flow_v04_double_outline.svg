    <rect class="halo" x="648" y="542" width="132" height="84" rx="14"/>
  </g>fill: none; stroke: #bfdbfe; stroke-width: 2; opacity: .45; }
      .node-header { fill: #eff6ff; opacity: .75; }
      @keyframes flowDash {
        from { stroke-dashoffset: 44; }
        to { stroke-dashoffset: 0; }
