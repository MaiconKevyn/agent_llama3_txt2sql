<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Double Outline Animated DataVisSUS Text-to-SQL Agent Flow</title>
  <desc id="desc">Double Outline style variation of the animated diagram preserving the same DataVisSUS Text-to-SQL flow and layout.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,6 0,12" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,6 0,12" fill="#047857"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 10,6 0,12" fill="#c2410c"/>
    </marker>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style><![CDATA[
      .bg { fill: #ffffff; }
