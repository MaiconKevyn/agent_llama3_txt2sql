    <rect class="llm-badge" x="1191" y="417" width="32" height="18" rx="9"/>
    <text class="badge-label" x="1207" y="430">LLM</text>
    <text class="label-small" x="1207" y="459"><tspan x="1207" dy="0">4. Semantic</tspan><tspan x="1207" dy="16">plan</tspan></text>

    <rect class="step" x="1142" y="548" width="130" height="72" rx="10"/>
    <rect class="llm-badge" x="1191" y="535" width="32" height="18" rx="9"/>
    <text class="badge-label" x="1207" y="548">LLM</text>
    <text class="label-small" x="1207" y="577"><tspan x="1207" dy="0">5. Generate</tspan><tspan x="1207" dy="16">SQL</tspan></text>
    <rect class="step" x="982" y="548" width="120" height="72" rx="10"/>
    <rect class="llm-badge" x="1026" y="535" width="32" height="18" rx="9"/>
    <text class="badge-label" x="1042" y="548">LLM</text>
    <text class="label-small" x="1042" y="588">6. Validate</text>
    <rect class="step" x="814" y="548" width="128" height="72" rx="10"/>
