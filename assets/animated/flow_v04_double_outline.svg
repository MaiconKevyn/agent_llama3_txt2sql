    <rect class="step" x="654" y="548" width="120" height="72" rx="10"/>
    <rect class="llm-badge" x="698" y="535" width="32" height="18" rx="9"/>
    <text class="badge-label" x="714" y="548">LLM</text>
    <text class="label-small" x="714" y="577"><tspan x="714" dy="0">8. Compose</tspan><tspan x="714" dy="16">answer</tspan></text>
