      .orange-label { fill: #c2410c; font: 700 14px Inter, Arial, sans-serif; text-anchor: middle; }
      .phase-label { fill: #334155; font: 700 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .muted-label { fill: #64748b; font: italic 13px Inter, Arial, sans-serif; text-anchor: middle; }
      .person { fill: #E3E9FD; stroke: #1d4ed8; stroke-width: 2.4;  }
      .flow-blue {
        fill: none;
        stroke: #1d4ed8;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 12 10;
        marker-end: url(#arrow-blue);
        animation: flowDash 1.4s linear infinite;
      }
      .flow-green {
        fill: none;
        stroke: #047857;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 12 10;
        marker-end: url(#arrow-green);
        animation: flowDash 1.4s linear infinite;
      }
      .flow-orange {
        fill: none;
        stroke: #c2410c;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 12 10;
        marker-end: url(#arrow-orange);
        animation: flowDash 1.4s linear infinite;
      }
      .plain-line {
        fill: none;
        stroke: #cbd5e1;
        stroke-width: 1.3;
      }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; opacity: .55; }
      .accent-panel { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1; opacity: .2; }
      .halo { 
  <g id="style-adornment-halos">
    <rect class="halo" x="648" y="424" width="132" height="84" rx="14"/>
    <rect class="halo" x="808" y="424" width="140" height="84" rx="14"/>
    <rect class="halo" x="976" y="424" width="132" height="84" rx="14"/>
